<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Battle</title>
  <style>
    body {
      background: radial-gradient(ellipse at 50% 30%, #232526 60%, #1a1a1a 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', 'Kanit', Arial, sans-serif;
      margin: 0;
      color: #f3f3f3;
      letter-spacing: 0.01em;
      overflow-x: hidden;
    }
    #game-ui {
      max-width: 500px;
      margin: 40px auto 0 auto;
      background: linear-gradient(135deg, rgba(30,30,40,0.98) 80%, #232526 100%);
      border-radius: 28px;
      box-shadow: 0 12px 40px 0 #000a, 0 2px 12px 0 #ffe08222;
      padding: 36px 20px 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      border: 3px solid #ffe082;
      position: relative;
    }
    #battle-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 22px;
      margin-bottom: 10px;
    }
    .character {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 48%;
      position: relative;
      background: linear-gradient(135deg, #232526 60%, #414345 100%);
      border-radius: 18px;
      box-shadow: 0 2px 12px 0 #ffe08222;
      border: 2.5px solid #64b5f6;
      padding: 12px 0 8px 0;
    }
    .character img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 18px;
      background: #232526;
      box-shadow: 0 2px 16px 0 #ffe08244, 0 0px 0px 2px #b2ff59;
      border: 3px solid #ffe082;
      transition: box-shadow 0.2s;
    }
    .character img:active {
      box-shadow: 0 0 24px 8px #ff5252cc;
    }
    .hp-bar-container {
      width: 90%;
      background: #181818;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 6px 0 #ff525244;
      border: 2px solid #ff5252;
      margin: 0 auto;
    }
    .hp-bar {
      width: 100%;
      background: linear-gradient(90deg, #ff5252 0%, #ffe082 100%);
      color: #232526;
      font-weight: bold;
      text-align: center;
      padding: 6px 0;
      font-size: 1.15em;
      border-radius: 8px;
      transition: width 0.3s;
      text-shadow: 0 1px 4px #fffde7cc;
      letter-spacing: 0.04em;
    }
    #action-buttons {
      display: flex;
      gap: 22px;
      margin: 10px 0 0 0;
    }
    #action-buttons button {
      background: linear-gradient(90deg, #b2ff59 0%, #ffe082 100%);
      color: #232526;
      font-weight: 700;
      border: 2.5px solid #64b5f6;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 1.15em;
      cursor: pointer;
      box-shadow: 0 2px 12px 0 #b2ff5915;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      text-shadow: 0 1px 4px #fffde7cc;
    }
    #action-buttons button:hover {
      background: linear-gradient(90deg, #ffe082 0%, #b2ff59 100%);
      transform: translateY(-2px) scale(1.06);
      box-shadow: 0 4px 18px 0 #ffe08244;
    }
    #question {
      background: linear-gradient(135deg, #232526 80%, #414345 100%);
      border-radius: 18px;
      box-shadow: 0 2px 12px 0 #ffe08222;
      padding: 22px 14px 16px 14px;
      width: 100%;
      margin: 0 0 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border: 2.5px solid #64b5f6;
    }
    #question-text {
      font-size: 1.18em;
      color: #ffe082;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      text-shadow: 0 1px 4px #232526cc;
    }
    #answerButtons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
    }
    #answerButtons button {
      background: linear-gradient(90deg, #64b5f6 0%, #b2ff59 100%);
      color: #232526;
      font-weight: 700;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 1.05em;
      cursor: pointer;
      box-shadow: 0 1px 8px 0 #64b5f622;
      transition: background 0.2s, transform 0.1s;
      text-shadow: 0 1px 4px #fffde7cc;
    }
    #answerButtons button:hover {
      background: linear-gradient(90deg, #b2ff59 0%, #64b5f6 100%);
      transform: translateY(-2px) scale(1.06);
    }
    #log {
      min-height: 32px;
      color: #b2ff59;
      font-size: 1.15em;
      font-weight: 700;
      text-align: center;
      margin: 8px 0 0 0;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 4px #232526;
      background: rgba(50,60,40,0.18);
      border-radius: 8px;
      padding: 6px 0;
      border: 2px solid #b2ff59;
      box-shadow: 0 1px 6px 0 #b2ff5922;
    }
    #score {
      color: #ffe082;
      font-size: 1.15em;
      font-weight: 800;
      margin: 0 0 10px 0;
      text-align: center;
      text-shadow: 0 1px 4px #232526cc;
    }
    #reset-btn {
      background: linear-gradient(90deg, #ff5252 0%, #ffe082 100%);
      color: #232526;
      font-weight: 700;
      border: 2.5px solid #ffe082;
      border-radius: 14px;
      padding: 12px 36px;
      font-size: 1.15em;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 2px 12px 0 #ff525215;
      transition: background 0.2s, transform 0.1s;
      text-shadow: 0 1px 4px #fffde7cc;
    }
    #reset-btn:hover {
      background: linear-gradient(90deg, #ffe082 0%, #ff5252 100%);
      transform: translateY(-2px) scale(1.06);
    }
    /* --- LOBBY REVAMP --- */
    #lobby-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: none;
      z-index: 10;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw;
      backdrop-filter: blur(0.5px);
      animation: fadeIn 0.7s;
    }
    #lobby-logo {
      font-size: 3.2em;
      margin-bottom: 10px;
      filter: drop-shadow(0 2px 8px #ffe08288);
      user-select: none;
      text-shadow: 0 2px 8px #23252688;
    }
    #lobby-title {
      font-size: 2.1em;
      font-weight: 800;
      color: #ffe082;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 8px #23252688;
    }
    #lobby-subtitle {
      font-size: 1.1em;
      color: #b2ff59;
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 4px #232526cc;
    }
    #lobby-desc {
      font-size: 1em;
      color: #fffde7;
      margin-bottom: 22px;
      max-width: 340px;
      text-align: center;
      opacity: 0.92;
      text-shadow: 0 1px 4px #232526cc;
    }
    #difficulty-select {
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: rgba(30,30,40,0.98);
      border-radius: 22px;
      box-shadow: 0 8px 32px 0 #ffe08222;
      padding: 38px 24px 32px 24px;
      max-width: 370px;
      align-items: center;
      animation: popIn 0.7s cubic-bezier(.68,-0.55,.27,1.55);
      border: 2.5px solid #ffe082;
    }
    #difficulty-select button {
      background: linear-gradient(90deg, #64b5f6 0%, #ffe082 100%);
      color: #232526;
      font-weight: 700;
      border: 2.5px solid #b2ff59;
      border-radius: 16px;
      padding: 16px 0;
      font-size: 1.18em;
      width: 210px;
      cursor: pointer;
      box-shadow: 0 2px 12px 0 #64b5f622;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      margin: 0 auto;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 4px #fffde7cc;
    }
    #difficulty-select button:hover {
      background: linear-gradient(90deg, #ffe082 0%, #64b5f6 100%);
      transform: translateY(-2px) scale(1.06);
      box-shadow: 0 4px 18px 0 #ffe08244;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      80% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }
    @media (max-width: 600px) {
      #game-ui {
        max-width: 98vw;
        padding: 12vw 2vw 8vw 2vw;
      }
      .character img {
        width: 64px;
        height: 64px;
      }
      #battle-container {
        gap: 8px;
      }
      #question {
        padding: 10px 2vw 8px 2vw;
      }
    }
  </style>
</head>
<body>
  <!-- Lobby revamp จะถูกสร้างโดย main.js (CSS lobby อยู่ใน <style>) -->

  <!-- Game UI (ซ่อนไว้ก่อน ให้ main.js ควบคุม) -->
  <div id="game-ui" style="display:none;">
    <div id="battle-container">
      <div class="character" style="position:relative;">
  <!-- ...existing code... (slot UI removed) -->
        <img id="player-img" src="asset/texture/player/P1_IDLE.gif" alt="Player" />
        <div class="hp-bar-container">
          <div id="player-hp-bar" class="hp-bar" data-max="100">100</div>
        </div>
      </div>
      <div class="character">
        <img id="enemy-img" src="asset/texture/enemy/E1_IDLE (NEW).png" alt="Enemy" onerror="this.src='asset/texture/enemy/E1_IDLE (NEW).png'" />
        <div class="hp-bar-container">
          <div id="enemy-hp-bar" class="hp-bar" data-max="100">100</div>
        </div>
      </div>
    </div>
  <!-- ...existing code... (slot action UI removed) -->
    <!-- Removed empty .slot-box CSS ruleset -->
    <div id="question">
      <p id="question-text">❓ คำถามจะอยู่ที่นี่</p>
      <div id="answerButtons"></div>
    </div>
    <div id="action-buttons">
      <button onclick="playerAction('attack')">โจมตี</button>
      <button onclick="playerAction('guard')">ป้องกัน</button>
    </div>
    <div id="log"></div>
    <div id="score">Score: 0</div>
    <button id="reset-btn" onclick="resetGame()">เริ่มใหม่</button>
  </div>


  <!-- Background Music (auto play, loop, hidden) -->
  <audio id="bgm" src="audio/Elevator_Music.mp3" loop preload="auto" style="display:none;"></audio>
  <div id="bgm-unlock" style="display:none;position:fixed;z-index:9999;top:0;left:0;width:100vw;height:100vh;background:rgba(30,30,40,0.96);color:#ffe082;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;">
    <div style="font-size:2em;">🔊</div>
    <div style="font-size:1.2em;font-weight:700;">แตะหน้าจอหรือกดปุ่มด้านล่างเพื่อเปิดเสียงเพลง</div>
    <button id="bgm-unlock-btn" style="background:linear-gradient(90deg,#ffe082,#b2ff59);color:#232526;font-weight:700;border:none;border-radius:16px;padding:18px 44px;font-size:1.2em;box-shadow:0 2px 12px 0 rgba(255,224,130,0.10);cursor:pointer;">เปิดเพลง</button>
  </div>
  <!-- ปุ่มปิด/เปิดเพลง -->
  <button id="bgm-toggle" title="ปิด/เปิดเพลง" style="position:fixed;top:18px;right:18px;z-index:10000;background:rgba(30,30,40,0.92);border:none;border-radius:50%;width:48px;height:48px;box-shadow:0 2px 12px 0 rgba(255,224,130,0.10);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.7em;color:#ffe082;transition:background 0.2s;">
    <span id="bgm-toggle-icon">🔊</span>
  </button>

  <script src="questions.js"></script>
  <script src="./js/main.js"></script>
  <script>
  // --- BGM UNLOCK UI ---
  // ฟังก์ชันนี้จะถูกเรียกเฉพาะตอนเริ่มเกมเท่านั้น
  window.tryPlayBGM = function() {
    var bgm = document.getElementById('bgm');
    if (!bgm) return;
    bgm.volume = 0.5;
    bgm.play().then(()=>{
      document.getElementById('bgm-unlock').style.display = 'none';
      updateBGMIcon();
    }).catch(()=>{
      document.getElementById('bgm-unlock').style.display = 'flex';
      updateBGMIcon();
    });
  }
  // ปุ่ม unlock
  window.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('bgm-unlock-btn');
    if (btn) btn.onclick = window.tryPlayBGM;
    // ปุ่ม toggle เพลง
    var toggle = document.getElementById('bgm-toggle');
    if (toggle) {
      toggle.onclick = function() {
        var bgm = document.getElementById('bgm');
        if (!bgm) return;
        if (bgm.paused) {
          window.tryPlayBGM();
        } else {
          bgm.pause();
          updateBGMIcon();
        }
      };
    }
    updateBGMIcon();
  });
  // อัปเดตไอคอนปุ่มเพลง
  function updateBGMIcon() {
    var bgm = document.getElementById('bgm');
    var icon = document.getElementById('bgm-toggle-icon');
    if (!bgm || !icon) return;
    icon.textContent = bgm.paused ? '🔇' : '🔊';
  }
  // อัปเดตไอคอนเมื่อเพลงหยุดเอง
  document.addEventListener('visibilitychange', updateBGMIcon);
  if (window.bgm) window.bgm.onpause = updateBGMIcon;
  if (window.bgm) window.bgm.onplay = updateBGMIcon;
  </script>
</body>
</html>
